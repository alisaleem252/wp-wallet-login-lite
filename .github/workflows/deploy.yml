name: Deploy release to WordPress.org

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: wporg-svn
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag, plugin Version header and readme Stable tag match
        run: |
          TAG="${GITHUB_REF_NAME}"
          HEADER=$(grep -m1 -iE '^[[:space:]]*\*?[[:space:]]*Version:' main.php | sed -E 's/^[^:]*:[[:space:]]*//' | tr -d '\r' | xargs)
          STABLE=$(grep -m1 -iE '^Stable tag:' readme.txt | sed -E 's/^[^:]*:[[:space:]]*//' | tr -d '\r' | xargs)
          echo "tag=$TAG  main.php Version=$HEADER  readme Stable tag=$STABLE"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$STABLE" ]; then
            echo "::error::Tag, main.php Version and readme.txt Stable tag must all be identical."
            exit 1
          fi

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: wallet-login
          VERSION: ${{ github.ref_name }}
